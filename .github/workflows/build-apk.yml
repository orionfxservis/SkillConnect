name: Build SkillConnect APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK permissions & licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          sudo mkdir -p "$SDK_DIR/licenses"
          sudo chmod -R a+rwX "$SDK_DIR" || true
          SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' >> "$SDK_DIR/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' >> "$SDK_DIR/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare environment secrets (.env & google-services.json)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          CLEAN_KEY="$(printf '%s' "$RESEND_API_KEY" | tr -d '[:space:]')"
          if [ -n "$CLEAN_KEY" ]; then
            printf 'RESEND_API_KEY=%s\n' "$CLEAN_KEY" > .env
          elif [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build Debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            FAILURE_TEXT="$(grep -A 30 -E 'FAILURE:|What went wrong:|Execution failed for task' build.log | head -n 45)"
            {
              echo "### Gradle Build Failure Details"
              echo '```'
              if [ -n "$FAILURE_TEXT" ]; then
                printf '%s\n' "$FAILURE_TEXT"
              else
                tail -n 50 build.log
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$EXIT_CODE"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.ExampleUnitTest" --no-daemon --stacktrace

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillConnect-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish direct mobile APK download (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SkillConnect-debug.apk
          if gh release view preview-apk >/dev/null 2>&1; then
            gh release upload preview-apk SkillConnect-debug.apk --clobber
          else
            gh release create preview-apk SkillConnect-debug.apk \
              --target "${{ github.sha }}" \
              --title "SkillConnect Mobile Preview APK" \
              --notes "Latest debug APK built automatically. Tap SkillConnect-debug.apk below on your Android phone to download and install." \
              --prerelease
          fi
